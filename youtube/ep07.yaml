  description: "中学受験・高校受験対策アニメ『アニメ日本史ラボ』第7話!\n徳川家康が開いた江戸幕府。戦の世を閉じて、260年の平和と鎖国の仕組みを作った大プロジェクトを、ヒスト先生とマナブの対話で楽しく学びます。\n江戸幕府成立(1603年)・征夷大将軍・幕府の体制(老中・三奉行)・大名の3分類(親藩/譜代/外様)・参勤交代(1635年)・キリスト教禁止(1612年)・島原の乱(1637年)・鎖国(1639年)・出島と長崎・四つの窓口(対馬/薩摩/松前)・町人文化の芽(元禄文化への布石)まで、テスト頻出をぎゅっと整理。クイズ3問つき!\n\n\n\n※時間は目安です。シリーズ: 日本史はじめて物語(全10話)\n次回 第8話「ペリー来航!幕末の動乱」もお楽しみに!\n\n音声: VOICEVOX(四国めたん・ずんだもん)/キャラクターデザインはオリジナル\n#日本史 #中学受験\n\n■ この動画の受験ポイント\n・江戸幕府 1603年 — 徳川家康が征夷大将軍に就任(江戸=東京)。\n・老中・大老・三奉行 — 老中が常時、大老は非常時。寺社・町・勘定の三奉行。\n・大名の3分類 — 親藩(一族)/譜代(古家臣)/外様(後から従属)。御三家は後継ぎ役。\n・参勤交代 1635年 — 1年おき江戸と領国を往復。妻子は江戸に、大名を経済的に弱める。\n・関ヶ原の戦い 1600年 — 家康が敵対勢力を破り、天下の実権を握る。\n・キリスト教禁止 1612年 — 外国と結ぶ大名を恐れて、布教を禁止。\n・島原の乱 1637年 — 九州のキリシタン農民一揆。天草四郎時貞、幕府が大軍で鎮圧。\n・鎖国 1639年 — ポルトガル船の来航禁止で完成。\n・出島・長崎 — 扇形の人工島。オランダとの貿易が続く唯一の外国拠点。\n・四つの窓口 — 長崎=オランダ・中国、対馬=朝鮮、薩摩=琉球、松前=アイヌ。\n\n■ クイズ (動画内で解答解説)\nQ1. 1603年、徳川家康が就任して、江戸幕府を開いた役職は何でしょう?\nQ2. 関ヶ原の戦いの後、徳川氏に従った大名は何というでしょう?\nQ3. 1637年、キリシタンの農民たちが九州で起こした一揆は何でしょう?\n\n■ 制作について\n本動画はAI(スクリプト・イラスト・音声・編集)により制作しています。\n音声: VOICEVOX (四国めたん / ずんだもん) キャラクター設定はオリジナルです。\n\n■ タイムスタンプ\n0:00 オープニング\n00:23 ストーリー本編\n06:55 受験ポイントまとめ\n07:43 クイズ3問\n08:55 エンディング・次回予告"
