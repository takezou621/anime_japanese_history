  description: "中学受験・高校受験対策アニメ『アニメ日本史ラボ』第3話!\n794年の平安京遷都から、華やかな国風文化まで。日本が「日本らしく」なる時代を、ヒスト先生とマナブの対話で楽しく学びます。\n桓武天皇・坂上田村麻呂(征夷大将軍)・薬子の変・摂関政治(藤原氏/摂政・関白)・藤原道長・荘園のはじまり(743年)・寝殿造・女房・紀貫之(土佐日記)・清少納言(枕草子)・紫式部(源氏物語)・絵巻物・浄土思想(阿弥陀信仰)まで、テスト頻出をぎゅっと整理。クイズ3問つき!\n\n\n\n※時間は目安です。シリーズ: 日本史はじめて物語(全10話)\n次回 第4話「武士誕生!源平合戦と鎌倉幕府」もお楽しみに!\n\n音声: VOICEVOX(四国めたん・ずんだもん)/キャラクターデザインはオリジナル\n#日本史 #中学受験\n\n■ この動画の受験ポイント\n・平安京遷都 794年 — 桓武天皇。長岡京→平安京(京都)。\n・征夷大将軍 — 797年、坂上田村麻呂が就任。東北の蝦夷を平定。\n・薬子の変 810年 — 嵯峨天皇が退け、蔵人所を新設。\n・摂政・関白 — 幼い天皇の代わり/成人天皇の補佐。藤原氏が独占。\n・荘園のはじまり — 743年墾田永年私財法→税を納めない私有地が広がる。\n・寝殿造・女房 — 対屋・回廊・池の貴族の家。宮中に仕える女房が活躍。\n・遣唐使の停止 894年 — 菅原道真の建言。これを機に国風文化が開花。\n・土佐日記・古今和歌集 — 紀貫之。かな日記のはじまり。\n・枕草子・源氏物語 — 清少納言の随筆/紫式部の物語(世界最古級の長編小説)。\n・浄土思想 — 阿弥陀如来を信じ来世の極楽浄土を願う。源信『往生要集』・空也。\n\n■ クイズ (動画内で解答解説)\nQ1. 幼い天皇の代わりに政治を行う役を何というでしょう?\nQ2. 清少納言が書いた、「をかし」の随筆は何でしょう?\nQ3. 810年、藤原薬子が政治を元に戻そうとして失敗した事件は何でしょう?\n\n■ 制作について\n本動画はAI(スクリプト・イラスト・音声・編集)により制作しています。\n音声: VOICEVOX (四国めたん / ずんだもん) キャラクター設定はオリジナルです。\n\n■ タイムスタンプ\n0:00 オープニング\n00:14 ストーリー本編\n07:09 受験ポイントまとめ\n08:04 クイズ3問\n09:13 エンディング・次回予告"
