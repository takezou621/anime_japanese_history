  description: "中学受験・高校受験対策アニメ『アニメ日本史ラボ』第6話!\n乱世を終わらせた二人の英雄、織田信長と豊臣秀吉。桶狭間から天下統一、そして桃山文化までを、ヒスト先生とマナブの対話で楽しく学びます。\n桶狭間の戦い(1560年)・岐阜と天下布武・安土城(1576年)・楽市楽座・長篠の戦い(1575年/鉄砲隊)・本能寺の変と山崎の戦い(1582年)・大坂城・天下統一(1590年)・太閤検地・刀狩・惣無事令・朝鮮出兵(文禄・慶長の役)・桃山文化と千利休のわび茶まで、テスト頻出をぎゅっと整理。クイズ3問つき!\n\n\n\n※時間は目安です。シリーズ: 日本史はじめて物語(全10話)\n次回 第7話「徳川家康の江戸幕府と鎖国」もお楽しみに!\n\n音声: VOICEVOX(四国めたん・ずんだもん)/キャラクターデザインはオリジナル\n#日本史 #中学受験\n\n■ この動画の受験ポイント\n・桶狭間の戦い 1560年 — 信長が今川義元を討ち取り、名を売る。\n・天下布武 1567年〜 — 稲葉山城を岐阜と改め、天下を武力で治める宣言。\n・安土城 1576年 — 琵琶湖畔の天主。石垣と白壁の当時最新の城。\n・楽市楽座 — 関所廃止・座の特権廃止で商人に自由な商売。\n・長篠の戦い 1575年 — 鉄砲隊を活用して武田の騎馬隊を破る(三段撃ちは諸説あり)。\n・本能寺の変・山崎の戦い 1582年 — 明智光秀の謀反→秀吉が光秀を討つ(13日天下)。\n・大坂城 1583年 — 秀吉の拠点。天下統一1590年(小田原降伏)で完了。\n・太閤検地・刀狩 — 石高制の確立と兵農分離。\n・惣無事令・朝鮮出兵 — 私戦禁止。文禄(1592)・慶長(1597)の役で国が疲弊。\n・桃山文化 — 豪華絢爛(城・金屏風)/千利休のわび茶。\n\n■ クイズ (動画内で解答解説)\nQ1. 1560年、織田信長が今川義元を討ち取った戦いは何でしょう?\nQ2. 商人の商売を自由にした、信長の経済政策は何でしょう?\nQ3. 秀吉が全国の田畑を測り、石高で国の力を測るようにした政策は何でしょう?\n\n■ 制作について\n本動画はAI(スクリプト・イラスト・音声・編集)により制作しています。\n音声: VOICEVOX (四国めたん / ずんだもん) キャラクター設定はオリジナルです。\n\n■ タイムスタンプ\n0:00 オープニング\n00:20 ストーリー本編\n06:14 受験ポイントまとめ\n07:05 クイズ3問\n08:13 エンディング・次回予告"
