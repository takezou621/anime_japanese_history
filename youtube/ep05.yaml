  description: "中学受験・高校受験対策アニメ『アニメ日本史ラボ』第5話!\n足利尊氏が開いた室町幕府。栄華と大乱、そして「戦国の始まり」までを、ヒスト先生とマナブの対話で楽しく学びます。\n楠木正成と鎌倉幕府滅亡(1333年)・建武の新政・足利尊氏と室町幕府(1338年)・南北朝時代(約56年)・足利義満と日明貿易・金閣と北山文化(1397年)・応仁の乱(1467年)・守護の分国支配・下剋上の芽・銀閣と東山文化・戦国大名の登場まで、テスト頻出をぎゅっと整理。クイズ3問つき!\n\n\n\n※時間は目安です。シリーズ: 日本史はじめて物語(全10話)\n次回 第6話「織田信長と豊臣秀吉の天下統一」もお楽しみに!\n\n音声: VOICEVOX(四国めたん・ずんだもん)/キャラクターデザインはオリジナル\n#日本史 #中学受験\n\n■ この動画の受験ポイント\n・鎌倉幕府滅亡 1333年 — 後醍醐天皇の討幕。楠木正成・新田義貞が活躍。\n・建武の新政 1333年 — 公家中心の親政。武士が離反し3年で挫折。\n・室町幕府 1338年 — 足利尊氏が征夷大将軍に。1336年湊川で楠木正成戦死。\n・南北朝時代 約56年 — 北朝(京都)vs南朝(吉野)。1392年に合一。\n・足利義満 — 将軍の権力を頂点まで高めた3代将軍。\n・日明貿易 — 義満が開始。勘合符を使い、倭寇取り締まりと引き換え。\n・北山文化 1397年〜 — 金閣に代表される華麗な文化(公家×武家)。\n・応仁の乱 1467年 — 細川勝元(東軍)vs山名宗全(西軍)。11年続き、戦国の始まり。\n・分国支配・下剋上 — 守護が領国を私物化、守護代・国人が主を超える芽。\n・東山文化 — 銀閣(義政)。茶の湯・生け花・枯山水などひなびた美。\n\n■ クイズ (動画内で解答解説)\nQ1. 1333年、鎌倉幕府を倒す力となった、後醍醐天皇に尽くした武将はだれでしょう?\nQ2. 1467年、京都を焼け野原にして、戦国時代の入り口になった乱は何でしょう?\nQ3. 足利義満が明と始めた、勘合符を使う貿易は何でしょう?\n\n■ 制作について\n本動画はAI(スクリプト・イラスト・音声・編集)により制作しています。\n音声: VOICEVOX (四国めたん / ずんだもん) キャラクター設定はオリジナルです。\n\n■ タイムスタンプ\n0:00 オープニング\n00:19 ストーリー本編\n06:04 受験ポイントまとめ\n06:54 クイズ3問\n08:07 エンディング・次回予告"
