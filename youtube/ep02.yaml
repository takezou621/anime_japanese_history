  description: "中学受験・高校受験対策アニメ『アニメ日本史ラボ』第2話!\n飛鳥時代から奈良時代。日本が「国家」になっていく大ドラマを、ヒスト先生とマナブの対話で楽しく学びます。\n蘇我氏・聖徳太子(冠位十二階/十七条憲法/法隆寺)・遣隋使「日出づる処」・乙巳の変・大化の改新(645年)・公地公民・班田収授・租庸調・壬申の乱・大宝律令(701年)・二官八省一台・遣唐使・平城京遷都(710年)まで、テスト頻出をぎゅっと整理。クイズ3問つき!\n\n\n\n※時間は目安です。シリーズ: 日本史はじめて物語(全10話)\n次回 第3話「平安貴族の華やかな暮らし〜摂関政治と国風文化〜」もお楽しみに!\n\n音声: VOICEVOX(四国めたん・ずんだもん)/キャラクターデザインはオリジナル\n#日本史 #中学受験\n\n■ この動画の受験ポイント\n・聖徳太子の政治 — 摂政593年/冠位十二階603年/十七条憲法604年。\n・遣隋使 607年 — 小野妹子。「日出づる処の天子…」の国書。\n・乙巳の変 645年 — 中大兄皇子・中臣鎌足が蘇我入鹿を討つ。\n・大化の改新 — 645年開始。公地公民へ転換。\n・班田収授・租庸調 — 6年ごとに口分田/租=米・庸=労働・調=布や特産品。\n・壬申の乱 672年 — 天武天皇が勝利し、中央集権を強化。\n・大宝律令 701年 — 律令国家の完成。藤原不比等らが編纂。\n・二官八省一台 — 神祇官・太政官+八省。地方は国司・郡司。\n・遣唐使 630年〜 — 唐から制度・技術・文化を導入。\n・平城京遷都 710年 — 長安をモデルに朱雀大路・碁盤の目の都市。\n\n■ クイズ (動画内で解答解説)\nQ1. 603年、聖徳太子が作った、能力で位を決める制度は何でしょう?\nQ2. 645年、中大兄皇子と中臣鎌足が蘇我入鹿を討った事件は何でしょう?\nQ3. 710年に都が移された、奈良の都の名前は何でしょう?\n\n■ 制作について\n本動画はAI(スクリプト・イラスト・音声・編集)により制作しています。\n音声: VOICEVOX (四国めたん / ずんだもん) キャラクター設定はオリジナルです。\n\n■ タイムスタンプ\n0:00 オープニング\n00:13 ストーリー本編\n07:08 受験ポイントまとめ\n08:04 クイズ3問\n09:14 エンディング・次回予告"
