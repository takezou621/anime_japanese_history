  description: "中学受験・高校受験対策アニメ『アニメ日本史ラボ』第8話!\nペリーの黒船が日本の鍵を開け、260年の江戸幕府が動き出す激動の幕末。ヒスト先生とマナブの対話で楽しく学びます。\nペリー来航(1853年)・開国と日米和親条約(1854年/下田・函館開港)・日米修好通商条約(1858年/領事裁判権・税率固定の不平等条約)・尊王攘夷と開国派・大老井伊直弼と安政の大獄・桜田門外の変(1860年)・尊攘派の台頭(長州/薩摩)・薩英戦争・下関戦争・禁門の変(1864年)・薩長同盟(1866年/坂本龍馬)・大政奉還(1867年/徳川慶喜)まで、テスト頻出をぎゅっと整理。クイズ3問つき!\n\n\n\n※時間は目安です。シリーズ: 日本史はじめて物語(全10話)\n次回 第9話「明治維新と文明開化」もお楽しみに!\n\n音声: VOICEVOX(四国めたん・ずんだもん)/キャラクターデザインはオリジナル\n#日本史 #中学受験\n\n■ この動画の受験ポイント\n・ペリー来航 1853年 — 浦賀に黒船4隻、開国を要求して一時帰国。\n・日米和親条約 1854年 — 開国。下田・函館を開港。\n・日米修好通商条約 1858年 — ハリスと締結。不平等条約(領事裁判権・税率固定)。\n・安政五カ国条約 — 開港場は五カ所に拡大。\n・領事裁判権・税率固定 — 日本で裁けない/税率を日本で決められない。\n・尊王攘夷・開国 — 外国追放派と開国派に意見が分裂。\n・井伊直弼・安政の大獄 1858年〜 — 勅許なしで条約調印、批判者を弾圧(吉田松陰ら死亡)。\n・桜田門外の変 1860年 — 井伊直弼が水戸浪人に襲撃され死亡、幕府の権威低下。\n・尊攘派の台頭 — 長州(松下村塾・高杉晋作)/薩摩(西郷・大久保)。中心は京都へ。\n・禁門の変 1864年 — 蛤御門の戦いで長州敗北→敵薩摩に接近(伏線)。\n\n■ クイズ (動画内で解答解説)\nQ1. 1853年、浦賀に来航して開国を求めた、アメリカの提督はだれでしょう?\nQ2. 1858年の日米修好通商条約で、日本が不利になった点は何でしょう?\nQ3. 1866年、薩摩と長州を結んだ、仲介役の人物はだれでしょう?\n\n■ 制作について\n本動画はAI(スクリプト・イラスト・音声・編集)により制作しています。\n音声: VOICEVOX (四国めたん / ずんだもん) キャラクター設定はオリジナルです。\n\n■ タイムスタンプ\n0:00 オープニング\n00:14 ストーリー本編\n06:31 受験ポイントまとめ\n07:26 クイズ3問\n08:37 エンディング・次回予告"
