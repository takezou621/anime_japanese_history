  description: "中学受験・高校受験対策アニメ『アニメ日本史ラボ』第1話!\n日本の歴史のはじまり、旧石器時代から古墳時代までを、ヒスト先生とマナブの対話で楽しく学びます。\n縄文土器・竪穴住居・環状集落・水稲農業・高床倉庫・銅鐸・卑弥呼(邪馬台国)・前方後円墳・埴輪など、テストで差がつく頻出ポイントをぎゅっとまとめました。クイズ3問つき!\n\n▼タイムスタンプ(目安)\n0:00 オープニング\n0:20 旧石器時代(打製石器)\n0:45 縄文時代(縄文土器・竪穴住居・環状集落・貝塚)\n2:00 弥生時代(水稲農業・高床倉庫・環濠集落)\n3:05 邪馬台国と卑弥呼(239年)\n3:35 古墳時代(前方後円墳・埴輪・大和政権)\n4:40 受験ポイントまとめ\n5:10 クイズ3問\n5:40 エンディング・次回予告\n\n※時間は目安です。シリーズ: 日本史はじめて物語(全10話)\n次回 第2話「大化の改新はなぜ起きた?〜飛鳥・奈良〜」もお楽しみに!\n\n音声: VOICEVOX(四国めたん・ずんだもん)/キャラクターデザインはオリジナル\n#日本史 #中学受験\n\n■ この動画の受験ポイント\n・打製石器 — 石を打ち欠けて作る。旧石器時代の道具。\n・磨製石器 — 石を磨いて作る。縄文時代以降に登場。\n・縄文土器 — 世界最古級。名前の由来は縄のもよう。\n・竪穴住居・環状集落 — 半分地下の家と、円形に並ぶ集落。\n・貝塚 — 貝がらの層が当時のくらしの手がかり。\n・水稲農業 — 暖かく湿った平原・低地で開始。\n・高床倉庫 — お米を雨やネズミから守る倉庫。\n・環濠集落 — 戦争のはじまりとセットで覚える。\n・銅鐸・銅剣 — 銅鐸は祭り、銅剣は武器。\n・卑弥呼・239年 — 邪馬台国の女王が魏に遣使。記録は魏志倭人伝。\n・前方後円墳・埴輪 — 鍵穴型は船の形/素焼きの土製品。\n・大和政権 — 大和地方を中心に巨大古墳を築く豪族連合。\n\n■ クイズ (動画内で解答解説)\nQ1. 縄文時代に使われるようになった、石を磨いて作る石器は何でしょう?\nQ2. 239年、魏に使者を送った邪馬台国の女王はだれでしょう?\nQ3. 弥生時代、大切なお米を雨やネズミから守るために建てた建物は何でしょう?\n\n■ 制作について\n本動画はAI(スクリプト・イラスト・音声・編集)により制作しています。\n音声: VOICEVOX (四国めたん / ずんだもん) キャラクター設定はオリジナルです。\n\n■ タイムスタンプ\n0:00 オープニング\n00:27 ストーリー本編\n07:10 受験ポイントまとめ\n07:58 クイズ3問\n09:05 エンディング・次回予告"
